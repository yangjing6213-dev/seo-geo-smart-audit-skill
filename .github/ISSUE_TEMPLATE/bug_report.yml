name: Bug report
description: Report a reproducible SearchScope defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the observed behavior without including private URLs or credentials.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest public or local test case that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python version, browser, and SearchScope version where relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted evidence
      description: Remove tokens, cookies, private URLs, customer reports, and personal data.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed secrets and private data.
          required: true
        - label: This is not a security vulnerability.
          required: true
